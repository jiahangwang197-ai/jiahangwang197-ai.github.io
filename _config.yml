title: jiahangwang197-ai
email: your-email@example.com
description: >-
  欢迎来到我的个人主页！这里记录我的技术笔记与生活随想。
baseurl: ""
url: "https://jiahangwang197-ai.github.io"
github_username: jiahangwang197-ai

# 主题
theme: minima

# 导航链接
header_pages:
  - about.md

# 社交媒体链接（可选）
# twitter_username: your_twitter
# linkedin_username: your_linkedin

# Minima 主题设置
minima:
  date_format: "%Y-%m-%d"
  social_links:
    - { platform: github, user_url: "https://github.com/jiahangwang197-ai" }

# 构建设置
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# RSS
feed:
  path: feed.xml

# 排除不需要构建的文件
exclude:
  - README.md
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor/
